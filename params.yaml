# ╔══════════════════════════════════════════════════════════════════╗
# ║  params.yaml — the "control panel" of the whole pipeline          ║
# ║  params.yaml — el "panel de control" de todo el pipeline          ║
# ║                                                                   ║
# ║  EN: Change a value here → `dvc repro` re-runs ONLY the stages    ║
# ║      that depend on it. Every value is logged to MLflow.          ║
# ║  ES: Cambia un valor aquí → `dvc repro` re-ejecuta SOLO las       ║
# ║      etapas que dependen de él. Todo se registra en MLflow.       ║
# ╚══════════════════════════════════════════════════════════════════╝

data:
  # Candidate names for gold — every broker calls it differently
  # Nombres posibles del oro — cada broker lo llama distinto
  symbol_candidates: ["XAUUSD", "GOLD", "XAUUSD.m", "XAUUSDm", "XAUUSD.a", "GOLDm"]
  timeframe: H1              # 1 candle = 1 hour / 1 vela = 1 hora
  n_bars: 30000              # ~5 years of H1 / ~5 años de H1
  raw_path: data/raw/xauusd_h1.csv
  sample_path: data/sample/xauusd_h1_sample.csv   # small copy for CI / copia pequeña para CI
  sample_bars: 4000

validate:
  max_missing_pct: 0.0       # no empty cells allowed / no se permiten celdas vacías
  min_rows: 1000
  report_path: reports/data_validation.json

features:
  processed_path: data/processed/features.csv
  return_lags: [1, 2, 3, 5, 10, 24]   # past returns (hours) / retornos pasados (horas)
  sma_windows: [10, 50, 200]
  rsi_window: 14
  volatility_window: 24
  # Target: 1 if next candle closes higher, 0 otherwise
  # Objetivo: 1 si la siguiente vela cierra más arriba, 0 si no
  horizon: 1

train:
  test_size: 0.2             # last 20% of time = unseen future / último 20% = futuro no visto
  cv_splits: 5               # walk-forward folds
  random_state: 42
  experiment_name: gold-direction-h1
  models:
    logistic_regression:
      C: 0.1
      max_iter: 1000
    random_forest:
      n_estimators: 300
      max_depth: 6
      min_samples_leaf: 50
    xgboost:
      n_estimators: 300
      max_depth: 3
      learning_rate: 0.03
      subsample: 0.8
      colsample_bytree: 0.8

evaluate:
  primary_metric: roc_auc
  # Quality gate: a model is promoted ONLY if it beats these
  # Control de calidad: un modelo se promueve SOLO si supera esto
  min_roc_auc: 0.51
  must_beat_baseline: true
  registered_model_name: gold-direction-h1
  champion_dir: models/champion
  metrics_path: reports/metrics.json

monitor:
  recent_bars: 500           # "today's market" window / ventana del "mercado de hoy"
  p_value_threshold: 0.01
  report_path: reports/drift.json
