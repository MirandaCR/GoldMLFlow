# ╔══════════════════════════════════════════════════════════════════╗
# ║  dvc.yaml — the recipe of the pipeline / la receta del pipeline   ║
# ║                                                                   ║
# ║  extract → validate → features → train → promote → drift          ║
# ║                                                                   ║
# ║  `dvc repro` runs only what changed (like a smart Makefile).      ║
# ║  `dvc repro` ejecuta solo lo que cambió (como un Makefile listo). ║
# ║  `dvc dag`   draws the graph / dibuja el grafo.                   ║
# ╚══════════════════════════════════════════════════════════════════╝
stages:
  extract:
    # Needs MetaTrader 5 open on Windows. Refresh data with: dvc repro -f extract
    cmd: python -m src.data.extract --sample
    deps:
      - src/data/extract.py
    params:
      - data
    outs:
      - data/raw/xauusd_h1.csv
      - data/sample/xauusd_h1_sample.csv:
          cache: false            # small file → kept in Git so CI can use it

  validate:
    cmd: python -m src.data.validate
    deps:
      - src/data/validate.py
      - data/raw/xauusd_h1.csv
    params:
      - validate
    outs:
      - reports/data_validation.json:
          cache: false

  features:
    cmd: python -m src.features.build
    deps:
      - src/features/build.py
      - data/raw/xauusd_h1.csv
      - reports/data_validation.json
    params:
      - features
    outs:
      - data/processed/features.csv

  train:
    cmd: python -m src.models.train
    deps:
      - src/models/train.py
      - data/processed/features.csv
    params:
      - train
    outs:
      - reports/train_results.json:
          cache: false

  promote:
    cmd: python -m src.models.promote
    deps:
      - src/models/promote.py
      - reports/train_results.json
    params:
      - evaluate
    metrics:
      - reports/metrics.json:
          cache: false
    outs:
      - models/champion:
          cache: false            # committed to Git → the Docker image is built from it

  drift:
    cmd: python -m src.monitoring.drift
    deps:
      - src/monitoring/drift.py
      - data/processed/features.csv
    params:
      - monitor
    outs:
      - reports/drift.json:
          cache: false
      - reports/figures/drift.png:
          cache: false
