# ╔══════════════════════════════════════════════════════════════════╗
# ║  CD — Continuous Delivery / Entrega Continua                      ║
# ║                                                                   ║
# ║  EN: Only when CI is ✅ on main: build the Docker image and       ║
# ║      publish it to GitHub Container Registry (ghcr.io), tagged    ║
# ║      with "latest" and the commit SHA. Anyone can then run:       ║
# ║        docker run -p 8000:8000 ghcr.io/mirandacr/goldmlflow:latest║
# ║  ES: Solo cuando el CI está ✅ en main: construye la imagen       ║
# ║      Docker y la publica en GitHub Container Registry (ghcr.io).  ║
# ║                                                                   ║
# ║   CI ✅ ──▶ build image ──▶ smoke test ──▶ push to ghcr.io 📦     ║
# ╚══════════════════════════════════════════════════════════════════╝
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # needed to push to ghcr.io

jobs:
  publish-image:
    name: 📦 Build & publish Docker image
    # Skip if CI failed / No se ejecuta si el CI falló
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read champion model version
        id: model
        run: |
          echo "name=$(python3 -c "import json;print(json.load(open('models/champion/metadata.json'))['best_model'])")" >> $GITHUB_OUTPUT
          echo "version=$(python3 -c "import json;print(json.load(open('models/champion/metadata.json'))['version'])")" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
            type=raw,value=model-v${{ steps.model.outputs.version }}
          labels: |
            org.opencontainers.image.description=Gold H1 direction API — model ${{ steps.model.outputs.name }} v${{ steps.model.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## 📦 Published" >> $GITHUB_STEP_SUMMARY
          echo "Model: **${{ steps.model.outputs.name }} v${{ steps.model.outputs.version }}**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
