[project]
name = "goldmlflow"
version = "1.0.0"
description = "MLOps for Dummies: predicting gold (XAUUSD) H1 direction with MLflow, DVC, FastAPI, Docker and GitHub Actions"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
